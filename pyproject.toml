[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hartree-fock"
version = "0.1.0"
description = "Ab initio quantum chemistry: Gaussian integrals, Hartree-Fock, MP2 and full CI"
authors = [{ name = "Ankit Pawar" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[tool.setuptools]
packages = ["hf"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
